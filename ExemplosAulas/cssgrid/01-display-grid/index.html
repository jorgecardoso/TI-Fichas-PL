<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Grid 01: Display e tracks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>01: Display Grid e tracks</h1>
  <p><code>display: grid</code> transforma o elemento num contentor grid. As propriedades <code>grid-template-columns</code> e <code>grid-template-rows</code> definem as colunas e linhas explícitas.</p>

  <div class="grid">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
  </div>
</body>
</html>
