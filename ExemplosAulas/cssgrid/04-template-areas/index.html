<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Grid 04: Template areas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>04: Criar um mapa com grid-template-areas</h1>
  <p><code>grid-template-areas</code> descreve a disposição da grelha com nomes. Cada texto entre aspas representa uma linha; repetir um nome une as células numa área. Os nomes têm de formar um retângulo.</p>

  <div class="layout">
    <header class="area header">Cabeçalho</header>
    <nav class="area menu">Menu</nav>
    <main class="area main">Conteúdo principal</main>
    <aside class="area aside">Lateral</aside>
    <footer class="area footer">Rodapé</footer>
  </div>
</body>
</html>
