<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Responsive Web Design with Flexbox</title>
  <link rel="stylesheet" type="text/css" href="1.css-rwd-flexbox.css">
  <link rel="stylesheet" type="text/css" href="1.css-rwd-flexbox-tablet.css">
  <link rel="stylesheet" type="text/css" href="1.css-rwd-flexbox-smartphone.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="logo"><img height="75">Logo here</div>
      <div class="banner"><img height="75">Annoying banner here</div>
    </header>

    <nav class="menu">Menu here</nav>

    <main class="content">
      <aside class="sidebar one"><img height="100">Sidebar here</aside>
      <section class="main" aria-label="Main content"><img height="275">Main content here</section>
      <aside class="sidebar two"><img height="200">Another sidebar here just for fun</aside>
    </main>

    <div class="footers">
      <footer class="footer one">Footer here</footer>
      <footer class="footer two">Footer here</footer>
      <footer class="footer three">Footer here</footer>
    </div>
  </div>
</body>

</html>
