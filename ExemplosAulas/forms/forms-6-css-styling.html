<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms 6 - Estilizar formulários com CSS</title>
  <link rel="stylesheet" href="forms-6-css-styling.css">
</head>
<body>
  <main>
    <h1>Estilizar formulários com CSS</h1>

    <form class="formulario" action="save.php" method="post">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Escreve o teu nome" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

      <label for="curso">Curso</label>
      <select id="curso" name="curso" required>
        <option value="">Escolhe uma opção</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
      </select>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreve uma mensagem curta"></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>
</body>
</html>
