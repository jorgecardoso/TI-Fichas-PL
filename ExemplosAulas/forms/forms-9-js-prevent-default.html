<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms 9 - Prevenir envio</title>
  <link rel="stylesheet" href="forms-9-js-prevent-default.css">
  <script src="forms-9-js-prevent-default.js" defer></script>
</head>
<body>
  <main>
    <h1>Prevenir o envio normal do formulário</h1>

    <form class="formulario" id="formularioContacto" action="save.php" method="post">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <button type="submit">Enviar</button>

      <p id="mensagem"></p>
    </form>
  </main>
</body>
</html>
