<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms 7 - Estados CSS</title>
  <link rel="stylesheet" href="forms-7-css-validation-states.css">
</head>
<body>
  <main>
    <h1>Estados visuais com CSS</h1>

    <form class="formulario" action="save.php" method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

      <label for="password">Palavra-passe</label>
      <input type="password" id="password" name="password" minlength="6" required>

      <button type="submit">Criar conta</button>
    </form>

    <p class="nota">
      Experimenta escrever um email inválido ou uma palavra-passe com menos de 6 caracteres.
    </p>
  </main>
</body>
</html>
