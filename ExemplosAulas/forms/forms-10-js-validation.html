<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms 10 - Validação com JavaScript</title>
  <link rel="stylesheet" href="forms-10-js-validation.css">
  <script src="forms-10-js-validation.js" defer></script>
</head>
<body>
  <main>
    <h1>Validação simples com JavaScript</h1>

    <form class="formulario" id="formularioInscricao" novalidate>
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome">

      <label for="email">Email</label>
      <input type="email" id="email" name="email">

      <label for="idade">Idade</label>
      <input type="number" id="idade" name="idade" min="1">

      <label for="curso">Curso</label>
      <select id="curso" name="curso">
        <option value="">Escolhe um curso</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
      </select>

      <button type="submit">Enviar inscrição</button>

      <p id="mensagem"></p>
    </form>
  </main>
</body>
</html>
